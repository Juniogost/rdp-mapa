<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Tour do decorado - prévia não listada</title>
<link rel="stylesheet" href="vendor/pannellum.css">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui;overflow:hidden}
#stage{position:fixed;inset:0}
#stage img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#pano{position:absolute;inset:0}
.barra{position:fixed;top:0;left:0;height:3px;background:#2d5a4a;z-index:30;transition:width .2s}
#topo{position:fixed;top:3px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;z-index:30;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#topo a{color:#fff;text-decoration:none;font-weight:700;font-size:15px}
#cont{font-size:13px;opacity:.9}
.seta{position:fixed;top:50%;transform:translateY(-50%);z-index:30;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:52px;height:52px;font-size:26px;line-height:1}
#setaE{left:10px}#setaD{right:10px}
#base{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
#sec{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
#leg{font-size:17px;font-weight:700;margin-top:2px}
#nota{font-size:11px;opacity:.75;margin-top:3px}
#cred{position:fixed;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.55);z-index:29;pointer-events:none}
#tod{position:fixed;top:38px;right:12px;z-index:31;display:flex;gap:6px}
#tod button{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 10px;font-size:12px}
#tod button.on{background:#2d5a4a;border-color:#2d5a4a}
#zoom{position:fixed;inset:0;z-index:50;background:#000;overflow:auto;display:none}
#zoom img{display:block;width:200%;max-width:none}
#zoomfechar{position:fixed;top:12px;right:12px;z-index:51;background:rgba(0,0,0,.6);color:#fff;border:1px solid #fff;border-radius:8px;padding:8px 12px;display:none}
.pnlm-controls-container{display:none!important}
#empnome{font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#sensia{font-size:11px;opacity:.75;margin-top:3px}
.dica{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;pointer-events:none;transition:opacity .6}
</style></head><body>
<div id="stage"><div id="pano"></div><img class="ph" id="foto" alt=""></div>
<div class="barra" id="barra"></div>
<div id="topo"><a id="voltar" href="../">‹ Voltar</a><span id="empnome"></span><span id="cont"></span></div>
<div id="tod"></div>
<button class="seta" id="setaE" aria-label="Anterior">‹</button>
<button class="seta" id="setaD" aria-label="Próxima">›</button>
<div id="base"><div id="sec"></div><div id="leg"></div><div id="nota"></div><div id="sensia" hidden>No material oficial da Tenda, o Itá Nobre aparece como "Sensia Alameda".</div></div>
<div id="cred">Imagens ilustrativas, material oficial Tenda</div>
<div id="zoom"><img id="zimg" alt=""></div><button id="zoomfechar">Fechar ✕</button>
<div class="dica" id="dica" style="opacity:0">Arraste para girar • deslize para trocar</div>
<script src="vendor/pannellum.js"></script>
<script src="data.js?v=3"></script>
<script>
const q=new URLSearchParams(location.search);const EMP=q.get('emp')==='luar'?'luar':'ita';
const D=TOURDATA.emps[EMP];
const NOMES={ita:'Itá Nobre',luar:'Novos Ares Luar'};
document.getElementById('empnome').textContent=NOMES[EMP];
document.title='Tour do decorado - '+NOMES[EMP]+' | Investe em Lotes';
if(EMP==='ita')document.getElementById('sensia').hidden=false;
document.getElementById('voltar').href='../?emp='+EMP;
const steps=[];
D.panos.forEach((p,i)=>steps.push({tipo:'pano',src:p.src,tod:p.tod,primeiro:i===0||p.tod!==D.panos[i-1].tod}));
D.secoes.forEach(s=>s.itens.forEach((it,i)=>steps.push({tipo:'foto',sec:s.secao,src:it.src,legenda:it.legenda,planta:it.planta,primeiro:i===0})));
let idx=0,viewer=null;
const $=id=>document.getElementById(id);
const todNomes={dia:'Dia',entardecer:'Entardecer',noite:'Noite'};
const grupos=[...new Set(D.panos.map(p=>p.tod))];
grupos.forEach(g=>{const b=document.createElement('button');b.textContent=todNomes[g];b.dataset.tod=g;b.onclick=()=>{const i=steps.findIndex(s=>s.tipo==='pano'&&s.tod===g);if(i>=0)go(i)};$('tod').appendChild(b)});
function go(i){idx=Math.max(0,Math.min(steps.length-1,i));const s=steps[idx];
 $('barra').style.width=((idx+1)/steps.length*100)+'%';
 $('cont').textContent=(idx+1)+' / '+steps.length;
 [...$('tod').children].forEach(b=>b.classList.toggle('on',s.tipo==='pano'&&s.tod===b.dataset.tod));
 $('tod').style.display=s.tipo==='pano'?'flex':'none';
 if(s.tipo==='pano'){$('foto').style.display='none';$('pano').style.display='block';
  if(viewer){viewer.destroy();viewer=null}
  viewer=pannellum.viewer('pano',{type:'equirectangular',panorama:s.src,autoLoad:true,compass:false,showZoomCtrl:false,showFullscreenCtrl:false,hfov:100});
  $('sec').textContent='Vista aérea 360°';$('leg').textContent='Vista aérea';
  $('nota').textContent='Fotos de drone da área externa do empreendimento.';
  if(idx===0){$('dica').style.opacity=1;setTimeout(()=>$('dica').style.opacity=0,2600)}
 }else{if(viewer){viewer.destroy();viewer=null}
  $('pano').style.display='none';const f=$('foto');f.style.display='block';f.src=s.src;f.alt=s.legenda;
  $('sec').textContent=s.sec;$('leg').textContent=s.legenda;
  $('nota').textContent=s.planta?'Toque na planta para ampliar.':''}
 $('setaE').style.visibility=idx===0?'hidden':'visible';
 $('setaD').style.visibility=idx===steps.length-1?'hidden':'visible'}
$('setaE').onclick=()=>go(idx-1);$('setaD').onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(idx-1);if(e.key==='ArrowRight')go(idx+1)});
let tx=null,ty=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
 if(Math.abs(dy)>Math.abs(dx))return;
 if(steps[idx].tipo==='pano'&&e.target.closest('#pano'))return;
 if(dx<-50)go(idx+1);if(dx>50)go(idx-1)},{passive:true});
$('foto').onclick=()=>{const s=steps[idx];if(s.tipo==='foto'&&s.planta){$('zimg').src=s.src;$('zoom').style.display='block';$('zoomfechar').style.display='block'}};
$('zoomfechar').onclick=()=>{$('zoom').style.display='none';$('zoomfechar').style.display='none'};
$('zoom').onclick=e=>{if(e.target.id==='zoom'){$('zoom').style.display='none';$('zoomfechar').style.display='none'}};
const h=parseInt((location.hash||'').replace('#',''),10);go(isNaN(h)?0:h);
</script></body></html>
